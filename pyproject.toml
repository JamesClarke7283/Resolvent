[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "resolvent"
version = "0.1.0"
description = "A local symbolic mathematics workbench for humans and language models"
readme = "README.md"
requires-python = ">=3.15"
license = "GPL-3.0-only"
dependencies = [
  "sympy>=1.14,<1.15",
  "antlr4-python3-runtime==4.11.1",
  "numpy>=2.2,<3",
  "quart>=0.20,<0.21",
  "hypercorn>=0.17,<0.19",
  "pydantic>=2.11,<3",
  "platformdirs>=4,<5",
  "mcp>=1.26,<2",
]

[project.optional-dependencies]
desktop = ["pywebview>=6,<7"]
qt = ["pywebview[qt]>=6,<7"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11", "playwright>=1.50"]

[project.scripts]
resolvent = "resolvent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/resolvent"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_NOTICES.md" = "resolvent/THIRD_PARTY_NOTICES.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
